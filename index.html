<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Een rustig en leuk memory-spel voor kinderen met de thema's dieren, superhelden en auto's.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%A9</text></svg>">
    <title>Spelletjes voor Shahin & Liyana</title>
    <link rel="stylesheet" href="css/style.css">


</head>
<body>
    <div class="app-container">
        <header>
            <h1>Tijd om te spelen!</h1>
            <button id="toggle-sound" class="btn">🔊 Geluid Aan</button>
        </header>

        <main>
            <!-- Het Menu Scherm -->
            <!-- Het Menu Scherm met Grote Thema Knoppen -->
            <section id="menu-screen" class="screen active">
                <h2>Kies een thema om te spelen:</h2>
                
                <div class="theme-buttons-grid">
                    <button class="theme-btn" data-theme="animals">
                        <span class="icon">🐶</span>
                        <span class="label">Dieren</span>
                    </button>
                    <button class="theme-btn" data-theme="superheroes">
                        <span class="icon">🦸‍♂️</span>
                        <span class="label">Superhelden</span>
                    </button>
                    <button class="theme-btn" data-theme="cars">
                        <span class="icon">🚗</span>
                        <span class="label">Auto's</span>
                    </button>
                </div>

                <div class="settings-group" style="margin-top: 25px;">
                    <p class="settings-label">Aantal kaarten:</p>
                    <div class="difficulty-buttons-grid" role="group" aria-label="Kies het aantal kaarten">
                        <button class="difficulty-btn selected" data-difficulty="6" aria-pressed="true" aria-label="Makkelijk, 6 kaarten">
                            <span class="icon">⭐</span>
                        </button>
                        <button class="difficulty-btn" data-difficulty="12" aria-pressed="false" aria-label="Gemiddeld, 12 kaarten">
                            <span class="icon">⭐⭐</span>
                        </button>
                        <button class="difficulty-btn" data-difficulty="16" aria-pressed="false" aria-label="Moeilijk, 16 kaarten">
                            <span class="icon">⭐⭐⭐</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Het Spelbord (verborgen tot je op start klikt) -->
            <section id="game-screen" class="screen hidden">
                <div id="game-board" class="memory-grid"></div>
                <button id="back-btn" class="btn">⬅ Terug naar menu</button>
            </section>

            <!-- Het Beloningsscherm (verborgen tot ze winnen) -->
           <!-- Het Beloningsscherm met de vrolijke achtergrond -->
           <section id="win-screen" class="screen hidden">
            <div class="win-card">
                <img src="assets/win-background.png" alt="Gefeliciteerd, je hebt alle paren gevonden! Vrolijke dieren vieren feest." class="win-image">
                <h2>Goed gedaan! 🎉</h2>
                <p>Geweldig gespeeld!</p>
                <button id="play-again-btn" class="btn btn-primary">⭐ Speel opnieuw</button>
            </div>
        </section>
        </main>
    </div>

 <!-- Eerst de memory logica laden, dan de main besturing -->
 <script src="js/memory.js"></script>
 <script src="js/main.js"></script>
</body>
</html>
